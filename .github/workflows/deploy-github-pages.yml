name: Deploy Angular to GitHub Pages

on:
  push:
    branches: ['master']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

env:
  # Carpeta que genera `ng build` (dist/<nombre-del-proyecto>/browser)
  BUILD_OUTPUT: dist/Uceva-Angular-Talle-Modules/browser

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Descargar el código
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Configurar Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # 3. Configurar GitHub Pages
      - name: Setup Pages
        uses: actions/configure-pages@v6

      # 4. Instalar dependencias
      - name: Install dependencies
        run: npm ci

      # 5. Ejecutar pruebas unitarias
      - name: Run Unit Tests
        run: npm test -- --ci

      # 6. Generar build de Angular con el base-href del repositorio
      #    (las rutas usan hash, así que no hace falta fallback 404.html)
      - name: Build Angular
        run: npm run build -- --base-href "/${{ github.event.repository.name }}/"

      # 7. Subir artefacto generado
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ env.BUILD_OUTPUT }}

  # Despliegue
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
